[build]
  functions = "functions/"

[template.environment]
  BASE_URL = "Base URL e.g. https://example.com"
  BUILD_BYPASS_KEY = "Build bypass key sent as X-IDP-Build-Key"
  IDP_NETLIFY_KEY = "Secret sent as X-IDP-Netlify-Key; the Cloudflare WAF skip rule on the non-live targets matches it"
  HTTP_AUTH_USER ="HTTP basic auth username for the target site (optional)"
  HTTP_AUTH_PASS = "HTTP basic auth password for the target site (optional)"
  IIAG_YEAR = "IIAG edition year used in download filenames, e.g. 2026-iiag.png (optional, defaults to 2026)"

[[redirects]]
  from = "/print/*"
  to = "/.netlify/functions/print/:splat"
  status = 200

[[redirects]]
  from = "/screenshot/*"
  to = "/.netlify/functions/screenshot/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/screenshot/:splat"
  status = 301
